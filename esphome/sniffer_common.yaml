esphome:
  name: $devicename
  friendly_name: $upper_devicename

esp32:
  board: featheresp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fallback Hotspot"
    password: "lost_sniffuh"

captive_portal:

# Enable logging
logger:
  #level: DEBUG
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha_api_key

ota:
  platform: esphome
  password: !secret ota_password

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%

# Grab font from https://fonts.google.com/specimen/Roboto and place in same directory as this file
font:
  - file: "gfonts://Roboto"
    id: sz_24
    size: 24
  - file: "gfonts://Roboto"
    id: sz_20
    size: 20
    glyphs: '!"%()+,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz/³µΩ'
  - file: "gfonts://Roboto"
    id: sz_13
    size: 13

binary_sensor:
  - platform: status
    name: "Node Status"
    id: system_status
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
    name: "Button S1"
    id: button0
    on_press:
      then:
        - switch.toggle: backlight

  - platform: gpio
    pin:
      number: GPIO35
      inverted: true
    name: "Button S2"
    id: button1
    on_press:
      then:
        - switch.toggle: backlight

switch:
  - platform: gpio
    pin: GPIO4
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

time:
  - platform: homeassistant
    id: esptime
    timezone: America/Los_Angeles

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

display:
  - platform: mipi_spi
    model: T-DISPLAY
    #backlight_pin: GPIO4
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    update_interval: 1s
    rotation: 270
    lambda: |-
      it.rectangle(0,  0, it.get_width(), it.get_height(), id(my_blue));
      it.rectangle(0, 19, it.get_width(), it.get_height(), id(my_blue));   // header bar

      it.strftime(4,  3, id(sz_13), id(my_yellow), TextAlign::TOP_LEFT, "%Y-%m-%d %H:%M:%S", id(esptime).now());

      if (id(system_status).state) {
        it.print(236, 3, id(sz_13), id(my_green), TextAlign::TOP_RIGHT, "${upper_devicename} Online");
      } else {
        it.print(236, 3, id(sz_13), id(my_red), TextAlign::TOP_RIGHT, "${upper_devicename} Offline");
      }

      int r = 18;

      it.print(4,    r, id(sz_24), id(my_gray),   TextAlign::TOP_LEFT,  "PM2.5:");

      auto color = id(my_red);
      if (id(pm_2_5_aqi).state < 50) color = id(my_green);
      else if (id(pm_2_5_aqi).state < 100) color = id(my_yellow);
      it.printf(236, r, id(sz_24), color, TextAlign::TOP_RIGHT, "%0.0f AQI", id(pm_2_5_aqi).state);

      r += 21;
      it.print(4,    r, id(sz_20), id(my_gray),   TextAlign::TOP_LEFT,  "PM:");
      it.printf(236, r, id(sz_20), id(my_yellow), TextAlign::TOP_RIGHT, "%0.0f/%0.0f/%0.0f µg/m³", id(pm_1_0).state, id(pm_2_5).state, id(pm_10).state);

      r += 25;
      it.print(120,    r, id(sz_24), id(my_gray),   TextAlign::TOP_CENTER,  "Environment");

      r += 23;
      float temp_f = id(temp).state * (9.0/5.0) + 32.0;
      it.printf(4,   r, id(sz_20), id(my_yellow), TextAlign::TOP_LEFT, "%0.1f°C", id(temp).state);
      it.printf(125, r, id(sz_24), id(my_yellow), TextAlign::TOP_CENTER, "%0.1f°F", temp_f);
      it.printf(236, r, id(sz_20), id(my_yellow), TextAlign::TOP_RIGHT,  "%0.1f%%", id(humidity).state);

      r += 21;
      it.printf(4,   r, id(sz_20), id(my_yellow), TextAlign::TOP_LEFT,  "%0.1f hPa", id(pressure).state);
      it.printf(236, r, id(sz_20), id(my_yellow), TextAlign::TOP_RIGHT, "%0.1f kΩ",  id(gas_resistance).state/1000.0);



# Particulate matter configuration entry
uart:
  rx_pin: GPIO27
  baud_rate: 9600

# For BME680
i2c:
  sda: 21
  scl: 22
  scan: True

sensor:
  - platform: pmsx003
    id: pmsa003
    type: PMSX003

    pm_1_0:
      id: pm_1_0
      name: "PM <1.0 µm"
      filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 10

    pm_2_5:
      id: pm_2_5
      name: "PM <2.5 µm"
      filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 10
      on_value:
        lambda: |-
          // https://en.wikipedia.org/wiki/Air_quality_index#Computing_the_AQI
          // https://web.archive.org/web/20201026120832/https://www.airnow.gov/sites/default/files/2018-05/aqi-technical-assistance-document-may2016.pdf
          // https://document.airnow.gov/technical-assistance-document-for-the-reporting-of-daily-air-quailty.pdf

          const float pts[][4] = {
            // pm2.5_min, pm2.5_max, aqi_min, aqi_max
            {        0.0,       9.0,     0.0,    50.0 }, // Good
            {        9.1,      35.4,    51.0,   100.0 }, // Moderate
            {       35.5,      55.4,   101.0,   150.0 }, // Unhealthy for sensitive groups
            {       55.5,     125.4,   151.0,   200.0 }, // Unhealthy
            {      125.5,     225.4,   201.0,   300.0 }, // Very Unhealthy
            {      225.5,     325.4,   301.0,   500.0 }, // Hazardous
          };
          const size_t pts_len = sizeof(pts)/sizeof(pts[0]);
          const size_t pts_max = pts_len - 1;

          float aqi; // default for out of range
          for (int i = 0; i < pts_len - 1; i++) {
            if (id(pm_2_5).state <= pts[i][1]) {
              aqi = ((pts[i][3] - pts[i][2]) / (pts[i][1] - pts[i][0])) * (id(pm_2_5).state - pts[i][0]) + pts[i][2];
              id(pm_2_5_aqi).publish_state(aqi);
              return;
            }
          }
          // If we make it here, then we're over the limit, per the AirNow docs:
          //
          // (4) AQI values between breakpoints are calculated using equation 1
          // to this appendix. For AQI values in the hazardous category, AQI
          // values greater than 500 should be calculated using equation 1 and
          // the concentration specified for the AQI value of 500. The AQI value
          // of 500 are as follows:
          // * O3 1-hour—0.604 ppm
          // * PM2.5 24-hour—325.4 μg/m3
          // * PM10 24-hour—604 μg/m3
          // * CO ppm—50.4 ppm
          // * SO2 1-hour—1004 ppb
          // * NO2 1-hour—2049 ppb
          aqi = ((pts[pts_max][3] - pts[pts_max][2]) / (pts[pts_max][1] - pts[pts_max][0])) * (id(pm_2_5).state - pts[pts_max][0]) + pts[pts_max][2];
          id(pm_2_5_aqi).publish_state(aqi);

    pm_10_0:
      id: pm_10
      name: "PM <10.0 µm"
      filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 10

  - platform: template
    name: "PM <2.5 AQI"
    unit_of_measurement: "AQI"
    icon: "mdi:air-filter"
    accuracy_decimals: 0
    id: pm_2_5_aqi

